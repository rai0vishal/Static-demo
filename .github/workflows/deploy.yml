
name: Validate and Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check HTML files
        run: |
          test -f public/index.html
          grep -qi "<!DOCTYPE html>" public/index.html
          grep -qi "<html" public/index.html
          grep -qi "<title>" public/index.html
          echo "HTML checks passed."

  deploy:
    name: Deploy to Cloudflare Pages
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=static-demo-ao3
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
